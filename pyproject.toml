[project]
name = "blvpy"
version = "0.1.0"
description = "A Python package for disciplined bilevel programming."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Hao Zhu", email = "zhuh@cs.uni-freiburg.de" },
]
keywords = [
    "bilevel optimization",
    "convex optimization",
    "disciplined parametrized programming",
    "disciplined nonlinear programming",
    "CVXPY",
]
requires-python = ">=3.12"
dependencies = [
    "cyipopt>=1.6",
    "cvxpy>=1.9",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.urls]
Repository = "https://github.com/dxogrp/blvpy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blvpy"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]
examples = [
    "marimo>=0.23",
    "matplotlib>=3.9",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
markers = [
    "ipopt: integration tests that require cyipopt and a native IPOPT installation",
]
