<div class="version-switcher" role="navigation" aria-label="Documentation version">
  <h3>{{ _('Version') }}</h3>
  <select
    id="blvpy-version-select"
    data-current-version="{{ release }}"
    data-switcher-url="{{ docs_switcher_url }}"
    aria-label="Documentation version"
    hidden
  >
    <option value="" selected>{{ release }}</option>
  </select>
  <p class="version-switcher-fallback">
    Release {{ release }}
  </p>
</div>
