name: Documentation deployment

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag_name:
        description: Exact Git tag containing the documentation source
        required: true
        type: string
      package_version:
        description: Canonical package version without the v prefix
        required: true
        type: string

jobs:
  build:
    name: Build ${{ inputs.tag_name }} documentation
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Verify documentation version
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          expected_version = os.environ["PACKAGE_VERSION"]
          release_tag = os.environ["RELEASE_TAG"]
          if project_version != expected_version or release_tag != f"v{expected_version}":
              raise SystemExit(
                  f"Documentation version mismatch: tag={release_tag!r}, expected={expected_version!r}, "
                  f"project={project_version!r}."
              )
          PY

      - name: Install native IPOPT and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes coinor-libipopt-dev pkg-config libblas-dev liblapack-dev gfortran

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install documentation dependencies
        run: uv sync --frozen --group dev --group docs

      - name: Verify documentation contract
        run: uv run --frozen --group dev --group docs python -m pytest tests/test_documentation.py

      - name: Build documentation
        run: uv run --frozen --group docs sphinx-build -W --keep-going -n -b html docs docs/_build/html

      - name: Recover previously published versions
        env:
          HISTORY_DIR: ${{ runner.temp }}/blvpy-pages-history
          SITE_DIR: ${{ runner.temp }}/blvpy-pages-site
        run: |
          mkdir -p "$SITE_DIR"
          set +e
          git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --no-tags origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git worktree add --detach "$HISTORY_DIR" refs/remotes/origin/gh-pages
            rsync --archive --exclude=.git "$HISTORY_DIR/" "$SITE_DIR/"
          elif [ "$status" -ne 2 ]; then
            echo "Could not inspect the remote gh-pages branch." >&2
            exit "$status"
          fi

      - name: Stage stable and immutable release documentation
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          SITE_DIR: ${{ runner.temp }}/blvpy-pages-site
        run: |
          uv run --frozen --group dev --group docs python scripts/stage_docs.py stage-release \
            --build-dir docs/_build/html \
            --site-dir "$SITE_DIR" \
            --version "$PACKAGE_VERSION" \
            --base-url https://dxogrp.github.io/blvpy/

      - name: Upload version-history artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blvpy-documentation-site-${{ inputs.package_version }}
          path: ${{ runner.temp }}/blvpy-pages-site
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/blvpy-pages-site

  publish:
    name: Publish stable and versioned documentation
    needs: build
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out release for authenticated publishing
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag_name }}

      - name: Download version-history artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: blvpy-documentation-site-${{ inputs.package_version }}
          path: ${{ runner.temp }}/blvpy-pages-site

      - name: Prepare GitHub Pages worktree
        env:
          PAGES_DIR: ${{ runner.temp }}/blvpy-pages
          SITE_DIR: ${{ runner.temp }}/blvpy-pages-site
        run: |
          set +e
          git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            git fetch --no-tags origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
            git worktree add --detach "$PAGES_DIR" refs/remotes/origin/gh-pages
          elif [ "$status" -eq 2 ]; then
            git worktree add --detach "$PAGES_DIR"
            git -C "$PAGES_DIR" checkout --orphan gh-pages
            git -C "$PAGES_DIR" rm -rf .
          else
            echo "Could not inspect the remote gh-pages branch." >&2
            exit "$status"
          fi
          rsync --archive --delete --exclude=.git "$SITE_DIR/" "$PAGES_DIR/"

      - name: Preserve version history on gh-pages
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          PAGES_DIR: ${{ runner.temp }}/blvpy-pages
        run: |
          git -C "$PAGES_DIR" config user.name "github-actions[bot]"
          git -C "$PAGES_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PAGES_DIR" add --all
          if git -C "$PAGES_DIR" diff --cached --quiet; then
            echo "Documentation history is already current."
          else
            git -C "$PAGES_DIR" commit -m "docs: publish $PACKAGE_VERSION"
            git -C "$PAGES_DIR" push origin HEAD:gh-pages
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  rebuild-site:
    name: Rebuild single-version documentation site
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out trusted publishing tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install native IPOPT and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes coinor-libipopt-dev pkg-config libblas-dev liblapack-dev gfortran

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install documentation dependencies
        run: uv sync --frozen --group dev --group docs

      - name: Resolve current stable version
        id: version
        run: |
          uv run --no-sync python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          from scripts.verify_release import canonical_stable_version

          project_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          canonical_stable_version(project_version)
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"package_version={project_version}\n")
          PY

      - name: Verify documentation contract
        run: uv run --no-sync python -m pytest tests/test_documentation.py

      - name: Build documentation
        run: uv run --no-sync sphinx-build -W --keep-going -n -b html docs docs/_build/html

      - name: Verify single-version rebuild precondition
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          PAGES_DIR: ${{ runner.temp }}/blvpy-pages
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "The gh-pages branch does not contain documentation to rebuild." >&2
            exit 1
          fi
          git fetch --no-tags origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach "$PAGES_DIR" refs/remotes/origin/gh-pages
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path

          from scripts.stage_docs import _canonical_version

          pages = Path(os.environ["PAGES_DIR"])
          expected = os.environ["PACKAGE_VERSION"]
          published = set()
          roots = [pages, pages / "version"]
          for root in roots:
              if not root.is_dir() or root.is_symlink():
                  continue
              for path in root.iterdir():
                  if not path.is_dir() or path.is_symlink():
                      continue
                  try:
                      canonical, _ = _canonical_version(path.name)
                  except ValueError:
                      continue
                  published.add(canonical)
          if published != {expected}:
              raise SystemExit(
                  f"Refusing to rebuild documentation history: expected only {expected!r}, found {sorted(published)!r}."
              )
          PY

      - name: Stage clean documentation site
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          SITE_DIR: ${{ runner.temp }}/blvpy-pages-site
        run: |
          mkdir "$SITE_DIR"
          uv run --no-sync python scripts/stage_docs.py stage-release \
            --build-dir docs/_build/html \
            --site-dir "$SITE_DIR" \
            --version "$PACKAGE_VERSION" \
            --base-url https://dxogrp.github.io/blvpy/

      - name: Replace gh-pages with rebuilt site
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          PAGES_DIR: ${{ runner.temp }}/blvpy-pages
          SITE_DIR: ${{ runner.temp }}/blvpy-pages-site
        run: |
          rsync --archive --delete --exclude=.git "$SITE_DIR/" "$PAGES_DIR/"
          git -C "$PAGES_DIR" config user.name "github-actions[bot]"
          git -C "$PAGES_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PAGES_DIR" add --all
          if git -C "$PAGES_DIR" diff --cached --quiet; then
            echo "The documentation site is already current."
          else
            git -C "$PAGES_DIR" commit -m "docs: rebuild $PACKAGE_VERSION site"
            git -C "$PAGES_DIR" push origin HEAD:gh-pages
          fi

      - name: Upload rebuilt Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/blvpy-pages-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
