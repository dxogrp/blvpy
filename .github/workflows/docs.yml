name: Documentation deployment

on:
  workflow_dispatch:

concurrency:
  group: blvpy-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build selected documentation series
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      previous_tip: ${{ steps.history.outputs.previous_tip }}

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Record the selected package version
        id: version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          package_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"package_version={package_version}\n")
          PY

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install native IPOPT and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes coinor-libipopt-dev pkg-config libblas-dev liblapack-dev gfortran

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install documentation dependencies
        run: uv sync --frozen --group dev --group docs

      - name: Verify documentation
        run: uv run --frozen --group dev --group docs python -m pytest tests/test_docs.py

      - name: Build documentation from the selected commit
        env:
          BLVPY_DOCS_SOURCE_REF: ${{ github.sha }}
        run: uv run --frozen --group docs sphinx-build -W --keep-going -n -b html docs docs/_build/html

      - name: Recover the published series site
        id: history
        env:
          HISTORY_DIR: ${{ runner.temp }}/blvpy-pages-history
          SITE_DIR: ${{ runner.temp }}/blvpy-pages-site
        run: |
          git fetch --no-tags origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          previous_tip="$(git rev-parse refs/remotes/origin/gh-pages)"
          echo "previous_tip=$previous_tip" >> "$GITHUB_OUTPUT"
          git worktree add --detach "$HISTORY_DIR" "$previous_tip"
          mkdir -p "$SITE_DIR"
          rsync --archive --exclude=.git "$HISTORY_DIR/" "$SITE_DIR/"

      - name: Stage the mutable documentation series
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.package_version }}
          SITE_DIR: ${{ runner.temp }}/blvpy-pages-site
        run: |
          uv run --frozen --group dev --group docs python scripts/stage_docs.py stage-series \
            --build-dir docs/_build/html \
            --site-dir "$SITE_DIR" \
            --package-version "$PACKAGE_VERSION" \
            --base-url https://dxogrp.github.io/blvpy/

      - name: Upload staged-site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blvpy-documentation-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blvpy-pages-site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: blvpy-pages-series-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blvpy-pages-site
          include-hidden-files: true

  publish:
    name: Publish mutable documentation series
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the selected commit for authenticated publishing
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}

      - name: Download staged-site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blvpy-documentation-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blvpy-pages-site

      - name: Prepare the existing GitHub Pages worktree
        env:
          EXPECTED_TIP: ${{ needs.build.outputs.previous_tip }}
          PAGES_DIR: ${{ runner.temp }}/blvpy-pages
          SITE_DIR: ${{ runner.temp }}/blvpy-pages-site
        run: |
          git fetch --no-tags origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          current_tip="$(git rev-parse refs/remotes/origin/gh-pages)"
          if [ "$current_tip" != "$EXPECTED_TIP" ]; then
            echo "gh-pages changed while documentation was being built." >&2
            exit 1
          fi
          git worktree add --detach "$PAGES_DIR" "$EXPECTED_TIP"
          rsync --archive --checksum --delete --exclude=.git "$SITE_DIR/" "$PAGES_DIR/"
          diff --recursive --brief --exclude=.git "$SITE_DIR" "$PAGES_DIR"

      - name: Commit the series update without rewriting history
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
          PAGES_DIR: ${{ runner.temp }}/blvpy-pages
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git -C "$PAGES_DIR" config user.name "github-actions[bot]"
          git -C "$PAGES_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PAGES_DIR" add --all
          if git -C "$PAGES_DIR" diff --cached --quiet; then
            echo "Documentation is already current."
          else
            short_sha="${SOURCE_SHA:0:12}"
            git -C "$PAGES_DIR" commit -m "docs: publish $PACKAGE_VERSION from $short_sha"
            git -C "$PAGES_DIR" push origin HEAD:refs/heads/gh-pages
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: blvpy-pages-series-${{ github.run_id }}-${{ github.run_attempt }}
