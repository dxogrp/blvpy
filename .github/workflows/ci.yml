name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-linux:
    name: Test (Linux, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install native IPOPT and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes coinor-libipopt-dev pkg-config libblas-dev liblapack-dev gfortran

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run python -m pytest tests

      - name: Run lint checks
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Build package
        run: uv build

  test-macos:
    name: Test (macOS, Python ${{ matrix.python-version }})
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install native IPOPT and build dependencies
        run: |
          brew install ipopt pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix ipopt)/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev

      - name: Verify native IPOPT binding
        run: uv run python -c "import cyipopt; print(cyipopt.__version__)"

      - name: Run tests
        run: uv run python -m pytest tests

      - name: Run lint checks
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Build package
        run: uv build

  test-windows:
    name: Test (Windows, Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5
        with:
          activate-environment: blvpy-ci
          channels: conda-forge
          conda-remove-defaults: "true"
          miniforge-version: "26.3.2-3"
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            .github/workflows/ci.yml

      - name: Install native optimization stack
        shell: pwsh
        run: |
          # CVXPY 1.9 pins a SparseDiffPy wheel that expects openblas.dll on Windows.
          conda install --yes --strict-channel-priority `
            "cyipopt=1.7.0" `
            "ipopt=3.14.19" `
            "libblas=*=*openblas" `
            "liblapack=*=*openblas"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          $python = Join-Path $env:CONDA_PREFIX "python.exe"
          $requirements = Join-Path $env:RUNNER_TEMP "blvpy-requirements.txt"
          uv export --frozen --group dev --no-hashes --output-file $requirements
          uv pip install --python $python --requirement $requirements

      - name: Verify installed environment
        shell: pwsh
        run: |
          $python = Join-Path $env:CONDA_PREFIX "python.exe"
          & $python -c "import cyipopt; from sparsediffpy import _sparsediffengine; assert cyipopt.__version__ == '1.7.0'"
          uv pip check --python $python

      - name: Run tests
        shell: pwsh
        run: python -m pytest tests

      - name: Run lint checks
        shell: pwsh
        run: |
          ruff check .
          ruff format --check .

      - name: Build package
        run: uv build
