# ONE-TIME MIGRATION WORKFLOW: DELETE THIS FILE AFTER THE LIVE SITE IS VERIFIED.
name: "ONE-TIME: Rebuild mutable documentation series"

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type REBUILD gh-pages to replace every published documentation file
        required: true
        type: string

concurrency:
  group: blvpy-pages
  cancel-in-progress: false

jobs:
  guard:
    name: Confirm the one-time main-branch migration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require main and the exact confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          if [ "$SELECTED_REF" != "refs/heads/main" ]; then
            echo "This one-time migration must be dispatched from main." >&2
            exit 1
          fi
          if [ "$CONFIRMATION" != "REBUILD gh-pages" ]; then
            echo "The confirmation must be exactly: REBUILD gh-pages" >&2
            exit 1
          fi

  build-series:
    name: Build documentation series ${{ matrix.series }}
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - series: "0.1"
            checkout_ref: v0.1.0
            source_ref: v0.1.0
            historical: true
          - series: "0.2"
            checkout_ref: v0.2.0
            source_ref: v0.2.0
            historical: true
          - series: "0.3"
            checkout_ref: ${{ github.sha }}
            source_ref: ${{ github.sha }}
            historical: false

    steps:
      - name: Check out the migration policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          path: policy
          ref: ${{ github.sha }}

      - name: Check out the series source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          path: source
          ref: ${{ matrix.checkout_ref }}

      - name: Overlay the major-minor presentation policy
        if: matrix.historical
        run: |
          cp policy/docs/conf.py source/docs/conf.py
          rsync --archive --delete policy/docs/_templates/ source/docs/_templates/
          install -m 0644 policy/docs/_static/version-switcher.js source/docs/_static/version-switcher.js

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install native IPOPT and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes coinor-libipopt-dev pkg-config libblas-dev liblapack-dev gfortran

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: source/uv.lock

      - name: Install the series documentation environment
        working-directory: source
        run: uv sync --frozen --group docs

      - name: Build the series from its exact source
        working-directory: source
        env:
          BLVPY_DOCS_SOURCE_REF: ${{ matrix.source_ref }}
        run: uv run --frozen --group docs sphinx-build -W --keep-going -n -b html docs docs/_build/html

      - name: Upload the series build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blvpy-docs-series-${{ matrix.series }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: source/docs/_build/html
          include-hidden-files: true
          if-no-files-found: error

  assemble:
    name: Assemble and validate a fresh documentation site
    needs: build-series
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      site_manifest: ${{ steps.validate.outputs.site_manifest }}

    steps:
      - name: Check out the exact migration source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Install native IPOPT and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes coinor-libipopt-dev pkg-config libblas-dev liblapack-dev gfortran

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install staging dependencies
        run: uv sync --frozen --group dev

      - name: Download the 0.1 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blvpy-docs-series-0.1-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/series/0.1

      - name: Download the 0.2 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blvpy-docs-series-0.2-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/series/0.2

      - name: Download the 0.3 build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blvpy-docs-series-0.3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/series/0.3

      - name: Verify the current source still belongs to series 0.3
        id: current-version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          package_version = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["version"]
          release = package_version.split(".")
          if len(release) != 3 or release[:2] != ["0", "3"]:
              raise SystemExit(
                  f"The one-time migration expects main to provide series 0.3, not {package_version!r}."
              )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"package_version={package_version}\n")
          PY

      - name: Assemble the site from an empty directory
        env:
          CURRENT_VERSION: ${{ steps.current-version.outputs.package_version }}
          SERIES_DIR: ${{ runner.temp }}/series
          SITE_DIR: ${{ runner.temp }}/blvpy-pages-fresh
        run: |
          mkdir "$SITE_DIR"
          uv run --frozen --group dev python scripts/stage_docs.py stage-series \
            --build-dir "$SERIES_DIR/0.1" \
            --site-dir "$SITE_DIR" \
            --package-version 0.1.0 \
            --base-url https://dxogrp.github.io/blvpy/
          uv run --frozen --group dev python scripts/stage_docs.py stage-series \
            --build-dir "$SERIES_DIR/0.2" \
            --site-dir "$SITE_DIR" \
            --package-version 0.2.0 \
            --base-url https://dxogrp.github.io/blvpy/
          uv run --frozen --group dev python scripts/stage_docs.py stage-series \
            --build-dir "$SERIES_DIR/0.3" \
            --site-dir "$SITE_DIR" \
            --package-version "$CURRENT_VERSION" \
            --base-url https://dxogrp.github.io/blvpy/

      - name: Validate the fresh site and record its manifest
        id: validate
        env:
          SERIES_DIR: ${{ runner.temp }}/series
          SITE_DIR: ${{ runner.temp }}/blvpy-pages-fresh
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          site = Path(os.environ["SITE_DIR"])
          builds = Path(os.environ["SERIES_DIR"])
          expected_series = {"0.1", "0.2", "0.3"}

          unsafe = [
              path.relative_to(site).as_posix()
              for path in site.rglob("*")
              if path.is_symlink() or ".git" in path.relative_to(site).parts
          ]
          if unsafe:
              raise SystemExit(f"Unsafe entries in assembled documentation: {unsafe}")

          version_root = site / "version"
          actual_series = {
              path.name
              for path in version_root.iterdir()
              if path.is_dir()
          }
          unexpected_entries = [
              path.name
              for path in version_root.iterdir()
              if not path.is_dir()
          ]
          if actual_series != expected_series or unexpected_entries:
              raise SystemExit(
                  "The assembled version tree must contain only 0.1, 0.2, and 0.3: "
                  f"directories={sorted(actual_series)}, other={unexpected_entries}."
              )

          base_url = "https://dxogrp.github.io/blvpy/"
          expected_switcher = [
              {"name": "latest", "version": "0.3", "url": base_url, "preferred": True},
              {"name": "0.3", "version": "0.3", "url": f"{base_url}version/0.3/", "preferred": False},
              {"name": "0.2", "version": "0.2", "url": f"{base_url}version/0.2/", "preferred": False},
              {"name": "0.1", "version": "0.1", "url": f"{base_url}version/0.1/", "preferred": False},
          ]
          switcher = json.loads((site / "switcher.json").read_text(encoding="utf-8"))
          if switcher != expected_switcher:
              raise SystemExit(f"Unexpected switcher metadata: {switcher!r}")

          def manifest(root: Path, *, site_root: bool = False) -> dict[str, str]:
              result = {}
              for path in sorted(root.rglob("*")):
                  if not path.is_file():
                      continue
                  relative = path.relative_to(root)
                  if site_root and (relative.parts[0] == "version" or relative.as_posix() == "switcher.json"):
                      continue
                  result[relative.as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()
              return result

          for series in sorted(expected_series):
              if manifest(builds / series) != manifest(version_root / series):
                  raise SystemExit(f"Published series {series} does not exactly match its fresh build.")
          if manifest(site, site_root=True) != manifest(version_root / "0.3"):
              raise SystemExit("The documentation root does not exactly match series 0.3.")

          digest = hashlib.sha256()
          for relative, file_hash in sorted(manifest(site).items()):
              digest.update(relative.encode("utf-8"))
              digest.update(b"\0")
              digest.update(file_hash.encode("ascii"))
              digest.update(b"\n")
          site_manifest = digest.hexdigest()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"site_manifest={site_manifest}\n")
          PY

      - name: Upload fresh-site diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blvpy-documentation-rebuild-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blvpy-pages-fresh
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload Pages artifact before changing gh-pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: blvpy-pages-rebuild-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blvpy-pages-fresh
          include-hidden-files: true

  publish:
    name: Replace gh-pages with the validated site
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out the exact migration source for publishing
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Download the validated fresh site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: blvpy-documentation-rebuild-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/blvpy-pages-fresh

      - name: Replace the existing gh-pages tree in a normal worktree
        id: replace
        env:
          PAGES_DIR: ${{ runner.temp }}/blvpy-pages
          SITE_DIR: ${{ runner.temp }}/blvpy-pages-fresh
          SITE_MANIFEST: ${{ needs.assemble.outputs.site_manifest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          previous_tip="$(git rev-parse refs/remotes/origin/gh-pages)"
          git worktree add --detach "$PAGES_DIR" "$previous_tip"
          rsync --archive --delete --exclude=.git "$SITE_DIR/" "$PAGES_DIR/"

          git -C "$PAGES_DIR" config user.name "github-actions[bot]"
          git -C "$PAGES_DIR" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$PAGES_DIR" add --all
          if git -C "$PAGES_DIR" diff --cached --quiet; then
            echo "The rebuilt site is already present on gh-pages."
            replacement_commit="$previous_tip"
          else
            git -C "$PAGES_DIR" commit -m "docs: rebuild mutable major-minor series"
            replacement_commit="$(git -C "$PAGES_DIR" rev-parse HEAD)"
            git -C "$PAGES_DIR" push origin HEAD:refs/heads/gh-pages
          fi

          {
            echo "## One-time documentation rebuild"
            echo "- Previous gh-pages tip: \`$previous_tip\`"
            echo "- Replacement commit: \`$replacement_commit\`"
            echo "- Main source SHA: \`$SOURCE_SHA\`"
            echo "- Site manifest SHA-256: \`$SITE_MANIFEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          artifact_name: blvpy-pages-rebuild-${{ github.run_id }}-${{ github.run_attempt }}
